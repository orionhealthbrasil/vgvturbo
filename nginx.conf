server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Media proxy: vgvturbo.com.br/m/{slug} → Supabase edge function
    location ~ ^/m/(.+)$ {
        return 302 https://atnjikvdbvyvyabsxctj.supabase.co/functions/v1/media-proxy?slug=$1;
    }

    # SPA fallback — todas as rotas do React vão para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
